name: Deploy Frontend via Runner Local

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # Isso diz para rodar no seu servidor local

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Sincronizar arquivos na pasta do Docker
        run: |
          # Como o runner já está no servidor, os comandos abaixo rodam direto nele
          # Vamos copiar o que o GitHub baixou para a pasta do projeto
          cp -R . /root/garantia/frontend/
          
          # Se preferir usar o Git dentro da pasta como estávamos fazendo:
          # cd /root/garantia/frontend
          # git fetch --all
          # git reset --hard origin/main